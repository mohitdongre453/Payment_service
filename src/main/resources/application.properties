spring.application.name=payment-system

server.port=8082

# =========================
# MySQL Configuration
# =========================

spring.datasource.url=jdbc:mysql://localhost:3306/order_process_kafka
spring.datasource.username=root
spring.datasource.password=mdc#64kgrw9
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA Configuration
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# Kafka Server
# =========================

spring.kafka.bootstrap-servers=localhost:9092

# =========================
# Kafka Consumer
# =========================

spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# =========================
# ErrorHandlingDeserializer
# =========================

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# =========================
# JSON Configuration
# =========================

spring.kafka.consumer.properties.spring.json.trusted.packages=com.amazon.order.event,com.amazon.payment.event

# =========================
# Optional: JSON type handling
# =========================

spring.kafka.consumer.properties.spring.json.use.type.headers=true